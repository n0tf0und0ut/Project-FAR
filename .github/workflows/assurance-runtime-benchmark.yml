name: Assurance Runtime Benchmark (advisory)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/assurance-runtime-benchmark.yml
      - tools/run_tests.py
      - validation/manifest.json
      - validation_bootstrap/assurance-lock.json

permissions:
  contents: read

jobs:
  compare-trace-modes:
    name: profile - ${{ matrix.tracing }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tracing: [baseline, seccomp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - name: Check exact candidate identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.16'
      - name: Install dependencies and trace backend
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat lean-toolchain)" == "leanprover/lean4:v4.19.0" ]]
          archive="$RUNNER_TEMP/lean-4.19.0-linux.tar.zst"
          curl -sSfL --retry 3 --retry-delay 1 --retry-max-time 120 --connect-timeout 15 --max-time 120 -o "$archive" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "FAR_LEAN_HOME=$RUNNER_TEMP/lean-4.19.0-linux" >> "$GITHUB_ENV"
      - name: Configure measured strace variant
        shell: bash
        env:
          MODE: ${{ matrix.tracing }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "seccomp" ]]; then
            mkdir -p "$RUNNER_TEMP/assurance-bin"
            printf '%s\n' '#!/bin/sh' 'exec /usr/bin/strace --seccomp-bpf "$@"' > "$RUNNER_TEMP/assurance-bin/strace"
            chmod 0755 "$RUNNER_TEMP/assurance-bin/strace"
            echo "$RUNNER_TEMP/assurance-bin" >> "$GITHUB_PATH"
          fi
          command -v strace
      - name: Produce isolated ephemeral signing key
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "FAR_VALIDATION_CACHE_SIGNING_KEY=$key" >> "$GITHUB_ENV"
      - name: Benchmark full traced profile without reuse or skipped checks
        shell: bash
        env:
          FAR_VALIDATION_TRUST_DOMAIN: project-far:${{ github.repository }}
          MODE: ${{ matrix.tracing }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation/runtime
          started="$(date +%s)"
          set +e
          python -m far_validation validate --profile pr-full --no-cache \
            --trace-dependencies --require-trace --require-signed-cache \
            --format json > "artifacts/validation/runtime/assurance-${MODE}.json"
          result=$?
          set -e
          elapsed="$(($(date +%s) - started))"
          echo "### ${MODE} traced profile" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Wall time: ${elapsed} seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: ${result}" >> "$GITHUB_STEP_SUMMARY"
          python - "artifacts/validation/runtime/assurance-${MODE}.json" <<'PY'
          import json, pathlib, sys
          payload=json.loads(pathlib.Path(sys.argv[1]).read_text())
          results=payload.get("results", [])
          failed=[row.get("check_id") for row in results if row.get("status")!="passed"]
          print(f"Registered checks: {len(results)}; unpassed: {failed}")
          if len(results)!=30 or failed:
              raise SystemExit("Benchmark did not exercise all 30 registered pr-full checks successfully")
          PY
          test "$result" -eq 0
      - name: Upload measured evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assurance-profile-${{ matrix.tracing }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/validation/runtime/assurance-*.json
          if-no-files-found: warn
          retention-days: 7
