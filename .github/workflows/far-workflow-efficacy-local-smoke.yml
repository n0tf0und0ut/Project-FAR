name: FAR Local Qwen Validation
on:
  pull_request:
    paths:
      - 'tools/workflow_efficacy_local_*.py'
      - 'tests/test_workflow_efficacy_local_*.py'
      - 'research/workflow-efficacy/LOCAL-QWEN*.md'
      - 'research/workflow-efficacy/local-qwen-*'
      - '.github/workflows/far-workflow-efficacy-local-smoke.yml'
permissions:
  contents: read
jobs:
  local-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact maintenance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original contracts and successor validation regressions
        run: |
          python -m unittest tests.test_workflow_efficacy_internal_fixtures tests.test_workflow_efficacy_local_ollama tests.test_workflow_efficacy_local_analysis tests.test_workflow_efficacy_free_agent tests.test_workflow_efficacy_free_agent_analysis -v
          python -m tools.workflow_efficacy_local_ollama contract
      # Original failed preflight and automatic-scoring workflow remain archived.
      # No live execution entry point: a separately registered successor is required.
