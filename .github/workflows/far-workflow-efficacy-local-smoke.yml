name: FAR Local Qwen Smoke
on:
  pull_request:
    paths:
      - tools/workflow_efficacy_local_ollama.py
      - tools/workflow_efficacy_local_analysis.py
      - tests/test_workflow_efficacy_local_ollama.py
      - .github/workflows/far-workflow-efficacy-local-smoke.yml
permissions:
  contents: read
jobs:
  local-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout historical instruction revisions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline contract tests
        run: |
          python -m unittest tests.test_workflow_efficacy_internal_fixtures tests.test_workflow_efficacy_local_ollama tests.test_workflow_efficacy_local_analysis -v
          python -m tools.workflow_efficacy_local_ollama contract
      - name: Install local inference and download public model
        env:
          OLLAMA_HOST: 127.0.0.1:11434
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          OLLAMA_VERSION=0.12.7 sh "$RUNNER_TEMP/ollama-install.sh"
          ollama --version
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:11434/api/version; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:11434/api/version
          ollama pull qwen2.5-coder:1.5b
          docker pull python:3.12-slim
          python -c "from tools.workflow_efficacy_local_ollama import model_sha; print('local model digest:',model_sha())"
      - name: Two unscored local inference and grading smoke trials
        run: |
          python -m tools.workflow_efficacy_local_ollama run-pair --index 0 --output research/workflow-efficacy/local-smoke/
      - name: Preserve actual model outputs, solutions, and grader transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: far-local-qwen-smoke
          path: research/workflow-efficacy/local-smoke/
          if-no-files-found: warn
          retention-days: 30
