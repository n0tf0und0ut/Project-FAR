name: AgentAlphaXiv Research Evidence Offline Verification

# Current-head static/synthetic verification. Full source downloads are one-shot
# archived experiments and are not re-run after purely documentary updates.
on:
  pull_request:
    paths:
      - '.github/workflows/agent-alphaxiv-offline-verification.yml'
      - 'tools/agent_alphaxiv_*.py'
      - 'tests/test_agent_alphaxiv_*.py'
      - 'research/external-validation/agent-alphaxiv-001/**'
      - 'research/external-validation/agent-alphaxiv-002/**'

permissions:
  contents: read

jobs:
  verify-source-receipts:
    if: >-
      github.repository == 'n0tf0und0ut/Project-FAR' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact proposed head with read-only permissions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay all synthetic failures and immutable external receipt hashes
        run: |
          python -m unittest discover -s tests -p 'test_agent_alphaxiv_*.py' -v
          python -m py_compile tools/agent_alphaxiv_*.py
