name: FAR Workflow Efficacy Free-Agent Access Smoke
on:
  pull_request:
    paths:
      - tools/workflow_efficacy_internal_fixtures.py
      - tools/workflow_efficacy_free_agent.py
      - tests/test_workflow_efficacy_internal_fixtures.py
      - tests/test_workflow_efficacy_free_agent.py
      - .github/workflows/far-workflow-free-smoke.yml
      - scripts/workflow_efficacy_start_ollama.sh
permissions:
  contents: read
jobs:
  access-smoke:
    # Only the named internal study branch. No credentials or task data sent.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/workflow-efficacy-keyless-internal-pilot-v02'
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - name: Checkout without persistent authentication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline corpus and runner tests
        run: |
          python -m unittest tests.test_workflow_efficacy_internal_fixtures tests.test_workflow_efficacy_free_agent -v
      - name: Start pinned no-key local model
        run: bash scripts/workflow_efficacy_start_ollama.sh
      - name: Verify locally hosted scripted-repair runner
        run: |
          python -m tools.workflow_efficacy_free_agent contract
          python - <<'PY'
          import json,urllib.request
          body=json.dumps({"model":"qwen2.5-coder:1.5b","stream":False,
              "messages":[{"role":"user","content":"Return Python code: def transform(d): return 1"}],
              "options":{"temperature":0,"num_ctx":16384,"num_predict":90}}).encode()
          req=urllib.request.Request("http://127.0.0.1:11434/api/chat",data=body,
              headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=180) as resp: payload=json.load(resp)
          assert payload.get("done") is True
          assert payload.get("prompt_eval_count",0)>0 and payload.get("eval_count",0)>0
          print("VALID_LOCAL_MODEL_GENERATION",payload["eval_count"])
          PY
      - name: Execute one excluded paired coding task for runner preflight
        run: |
          docker pull python:3.12-slim
          python -m tools.workflow_efficacy_free_agent run-pair --index 0 \
            --output research/workflow-efficacy/pilot-out/pair-0.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/workflow-efficacy/pilot-out/pair-0.json")
          rows = json.loads(p.read_text())
          assert len(rows) == 2
          assert {r["arm"] for r in rows} == {"control", "treatment"}
          for row in rows:
              print(row["task_id"],row["arm"], "steps", row["model_steps"],
                    "grader",row["grader_status"],"outcome",row["outcome"])
              assert row["model_steps"] > 0 and row["error_events"] == 0
              assert row["cli_exit_code"] == 0 and not row["timeout"]
              assert row["grader_status"] == "EXECUTED"
          PY
      - name: Retain excluded pilot pair for diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-efficacy-local-preflight-pair
          path: research/workflow-efficacy/pilot-out/
          if-no-files-found: warn
          retention-days: 7
