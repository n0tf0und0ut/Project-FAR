name: Repository Health
on:
  pull_request: null
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        show-progress: false
    - name: Verify CRE-002 checksum lock
      run: python3 tools/check_cre002_lock.py
    - name: Verify CRE-002-EXT-001 checksum lock
      run: python3 tools/check_cre002_ext001_checksums.py
    - name: Verify merged-PR residual reconciliation
      run: >-
        python3 tools/reconcile_merged_pr_review_findings.py
        --baseline docs/audits/merged-pr-review-classification/findings.json
        --decisions docs/audits/merged-pr-review-reconciliation/reconciliation-decisions.json
        --output-dir docs/audits/merged-pr-review-reconciliation --check
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run theory verifier
      run: python tools/verify_theory.py
    - name: Run canonical fast repository health check
      id: health
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        python tools/repo_health_check.py --fast 2>&1 | tee /tmp/repository-health.log
    - name: Print repository health root-cause tail
      if: always() && steps.health.outcome == 'failure'
      run: tail -n 180 /tmp/repository-health.log
    - name: Stage repository health log
      if: always() && steps.health.outcome == 'failure'
      run: |
        rm -rf artifacts/validation/runtime
        mkdir -p artifacts/validation/runtime
        cp /tmp/repository-health.log artifacts/validation/runtime/repository-health.log
    - name: Upload repository health log
      if: always() && steps.health.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: repository-health-failure-log
        path: artifacts/validation
        if-no-files-found: error
        retention-days: 7
    - name: Enforce repository health result
      if: always() && steps.health.outcome == 'failure'
      run: exit 1
    timeout-minutes: 30
