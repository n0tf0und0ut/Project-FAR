name: FAR vs generic agent causal contract (Research only)

on:
  pull_request:
    paths:
      - 'research/external-validation/far-agent-generic/**'
      - '.github/workflows/far-agent-generic-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-no-launch-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify frozen candidate bytes and blocked launch
        run: |
          set -euo pipefail
          python research/external-validation/far-agent-generic/verify_candidate.py
          python - <<'PY'
          import subprocess
          import sys
          p = subprocess.run([sys.executable,
              "research/external-validation/far-agent-generic/verify_candidate.py",
              "--require-launch"], capture_output=True, text=True)
          assert p.returncode == 3, (p.returncode, p.stdout, p.stderr)
          assert "DENIED:" in p.stdout
          print("PASS_REAL_AGENT_LAUNCH_PROHIBITED")
          PY
      - name: Run adversarial receipt/registration tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s research/external-validation/far-agent-generic \
            -p 'test_verify_candidate.py' -v
          python -m py_compile \
            research/external-validation/far-agent-generic/verify_candidate.py \
            research/external-validation/far-agent-generic/test_verify_candidate.py
