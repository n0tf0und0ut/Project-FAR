name: Exact Head Assurance
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact repository commit to assure
        required: true
        type: string
      base_sha:
        description: Exact protected-main comparison base
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: exact-head-assurance-${{ inputs.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAR_VALIDATION_TRUST_DOMAIN: project-far:${{ github.repository }}
    steps:
    - name: Validate dispatched identity before checkout
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        FAR_ASSURANCE_DISPATCH_BASE: ${{ inputs.base_sha }}
        FAR_ASSURANCE_DISPATCH_HEAD: ${{ inputs.head_sha }}
        FAR_ASSURANCE_DISPATCH_WORKFLOW_SHA: ${{ github.sha }}
        FAR_ASSURANCE_DISPATCH_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        [[ "$FAR_ASSURANCE_DISPATCH_REF" == "refs/heads/main" ]] || { echo 'dispatched exact-head assurance must use refs/heads/main' >&2; exit 1; }
        [[ "$FAR_ASSURANCE_DISPATCH_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid dispatched exact-head SHA' >&2; exit 1; }
        [[ "$FAR_ASSURANCE_DISPATCH_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid dispatched exact-head base SHA' >&2; exit 1; }
        [[ "$FAR_ASSURANCE_DISPATCH_BASE" == "$FAR_ASSURANCE_DISPATCH_WORKFLOW_SHA" ]] || { echo 'dispatched exact-head base differs from trusted main workflow ref' >&2; exit 1; }
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        show-progress: false
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - name: Verify dispatched checkout lineage before repository code runs
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        FAR_ASSURANCE_DISPATCH_BASE: ${{ inputs.base_sha }}
        FAR_ASSURANCE_DISPATCH_HEAD: ${{ inputs.head_sha }}
      run: |
        set -euo pipefail
        [[ "$(git rev-parse HEAD^{commit})" == "$FAR_ASSURANCE_DISPATCH_HEAD" ]] || { echo 'dispatched exact-head checkout mismatch' >&2; exit 1; }
        [[ "$(git rev-parse HEAD^1)" == "$FAR_ASSURANCE_DISPATCH_BASE" ]] || { echo 'dispatched exact-head review head is not a direct child of frozen main' >&2; exit 1; }
    - name: Derive per-job ephemeral validation signing key
      shell: bash
      run: "set -euo pipefail\n# This job executes candidate code, so no persistent secret or token may be key material.\n# The key signs and verifies evidence inside this job only.\nkey=\"$(openssl rand -hex 32)\"\necho \"::add-mask::$key\"\necho \"FAR_VALIDATION_CACHE_SIGNING_KEY=$key\" >> \"$GITHUB_ENV\"\n"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12.16'
    - name: Resolve comparison base
      id: base
      shell: bash
      run: "set -euo pipefail\ncase \"$FAR_ASSURANCE_EVENT\" in\n  pull_request) base=\"$FAR_ASSURANCE_PR_BASE\" ;;\n  push) base=\"$FAR_ASSURANCE_PUSH_BASE\" ;;\n  workflow_dispatch) base=\"$FAR_ASSURANCE_DISPATCH_BASE\" ;;\n  *) echo \"unsupported assurance event\" >&2; exit 1 ;;\nesac\n[[ \"$base\" =~ ^[0-9a-f]{40}$ && \"$base\" != 0000000000000000000000000000000000000000 ]]\ngit cat-file -e \"${base}^{commit}\"\ngit merge-base --is-ancestor \"$base\" HEAD\necho \"sha=$base\" >> \"$GITHUB_OUTPUT\"\n"
      env:
        FAR_ASSURANCE_EVENT: ${{ github.event_name }}
        FAR_ASSURANCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        FAR_ASSURANCE_PUSH_BASE: ${{ github.event.before }}
        FAR_ASSURANCE_DISPATCH_BASE: ${{ inputs.base_sha }}
    - name: Prepare assurance artifact directory
      run: mkdir -p artifacts/validation/runtime
    - name: Verify independent bootstrap
      run: python -I validation_bootstrap/verify.py
    - name: Run independent legacy-checker oracle
      run: python -I -X "pycache_prefix=$RUNNER_TEMP/far-pycache" validation_bootstrap/run_isolated.py oracle --json > artifacts/validation/runtime/independent-oracle.json
    - name: Detect test and validator weakening
      run: python -I -X "pycache_prefix=$RUNNER_TEMP/far-pycache" validation_bootstrap/run_isolated.py weakening --base "${{ steps.base.outputs.sha }}" --json > artifacts/validation/runtime/test-weakening.json
    - name: Exhaustively model-check engine state space
      run: python -I -X "pycache_prefix=$RUNNER_TEMP/far-pycache" validation_bootstrap/run_isolated.py formal --max-checks 4 --json > artifacts/validation/runtime/formal-model.json
    - name: Install pinned Lean toolchain
      shell: bash
      run: "set -euo pipefail\n# The release archive is bound to its SHA-256; no installer script or toolchain resolver runs.\n[[ \"$(cat lean-toolchain)\" == \"leanprover/lean4:v4.19.0\" ]] || { echo 'lean-toolchain changed; update the pinned archive and digest' >&2; exit 1; }\narchive=\"$RUNNER_TEMP/lean-4.19.0-linux.tar.zst\"\ncurl -sSfL --retry 3 --retry-delay 1 --retry-max-time 120 --connect-timeout 15 --max-time 120 -o \"$archive\" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst\necho \"6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $archive\" | sha256sum -c -\ntar --zstd -xf \"$archive\" -C \"$RUNNER_TEMP\"\necho \"FAR_LEAN_HOME=$RUNNER_TEMP/lean-4.19.0-linux\" >> \"$GITHUB_ENV\"\n"
    - name: Machine-check validation-engine assurance theorems
      shell: bash
      run: "set -euo pipefail\n\"$FAR_LEAN_HOME/bin/lean\" mechanization/lean/ValidationEngine.lean 2>&1 | tee artifacts/validation/runtime/lean-proof.log\n# `lean` exits 0 when a declaration uses `sorry`; that is only a warning.\nif grep -n \"declaration uses 'sorry'\" artifacts/validation/runtime/lean-proof.log; then\n  echo 'validation-engine assurance theorems use sorry' >&2\n  exit 1\nfi\npython -I - <<'PY2'\nimport json\nfrom pathlib import Path\nPath('artifacts/validation/runtime/lean-proof.json').write_text(\n    json.dumps({'successful': True, 'artifact': 'mechanization/lean/ValidationEngine.lean'}, indent=2),\n    encoding='utf-8',\n)\nPY2\n"
    - name: Install dependencies and trace backend
      run: 'python -m pip install -r requirements.txt

        sudo apt-get update -qq

        sudo apt-get install -y -qq strace

        '
    - name: Run validator assurance tests
      run: python -m unittest discover -s tests -p "test_validation_assurance.py" -v
    - name: Run complete traced validation profile
      run: python -m far_validation validate --profile pr-full --no-cache --trace-dependencies --require-trace --require-signed-cache
    - name: Run complete registered mutation campaign
      run: python -m far_validation mutations --json --report artifacts/validation/runtime/mutation-campaign.json > artifacts/validation/runtime/mutation-campaign.stdout.json
    # Compiling unlocked Lean can run code, so these steps are ordinary CI like the tests. They put the
    # compiles of lean.yml, far-core-v11-formalization.yml and pca-w5.yml into the required check.
    - name: Compile governed Lean modules and reject sorry
      shell: bash
      run: "set -euo pipefail\nlean() { \"$FAR_LEAN_HOME/bin/lean\" \"$@\"; }\nlog=\"$RUNNER_TEMP/governed-lean.txt\"\ntrap 'cat \"$log\"' EXIT\n# A subshell, so a failing compile exits it and the trap still prints to the job log.\n(\n  lean mechanization/lean/FARCore.lean\n  lean mechanization/lean/SCoreW5.lean\n  lean -o \"$RUNNER_TEMP/UPPSemanticKernel.olean\" mechanization/lean/UPPSemanticKernel.lean\n  lean mechanization/lean/G2OpenWorldLowerBound.lean\n  lean mechanization/lean/G3EpistemicMaximality.lean\n  lean mechanization/lean/Canonicality.lean\n  lean mechanization/lean/RepresentationInvariance.lean\n  lean mechanization/lean/QuotientMinimality.lean\n  lean mechanization/lean/DefinitionalCompleteness.lean\n  lean mechanization/lean/ConservativeExtensibility.lean\n  lean mechanization/lean/MaximalKnowability.lean\n  lean mechanization/lean/CanonicalUniversalityTerminal.lean\n  lean mechanization/lean/FARCanonicalBridge.lean\n  lean mechanization/lean/FARCanonicalUniversalityDecision.lean\n  LEAN_PATH=\"$RUNNER_TEMP\" lean mechanization/lean/FARCanonicalCountermodel.lean\n  lean mechanization/lean/W5ApproximationCost.lean\n  lean -o \"$RUNNER_TEMP/FARCoreV11Substrate.olean\" mechanization/lean/FARCoreV11Substrate.lean\n  LEAN_PATH=\"$RUNNER_TEMP\" lean -o \"$RUNNER_TEMP/FARCoreV11Claims001To012.olean\" mechanization/lean/FARCoreV11Claims001To012.lean\n  LEAN_PATH=\"$RUNNER_TEMP\" lean -o \"$RUNNER_TEMP/FARCoreV11Omega.olean\" mechanization/lean/FARCoreV11Omega.lean\n  LEAN_PATH=\"$RUNNER_TEMP\" lean -o \"$RUNNER_TEMP/FARCoreV11SSS.olean\" mechanization/lean/FARCoreV11SSS.lean\n  LEAN_PATH=\"$RUNNER_TEMP\" lean mechanization/lean/FARCoreV11Mutations.lean\n) > \"$log\" 2>&1\n# `lean` exits 0 when a declaration uses `sorry`; that is only a warning.\nif grep -n \"declaration uses 'sorry'\" \"$log\"; then\n  echo 'a governed Lean module uses sorry' >&2\n  exit 1\nfi\n"
    - name: Enforce FAR-CORE v1.1 kernel assumptions
      shell: bash
      run: "set -euo pipefail\npython tools/check_far_core_v11_formalization.py --emit-axiom-audit \"$RUNNER_TEMP/FARCoreV11GeneratedAxiomAudit.lean\"\nLEAN_PATH=\"$RUNNER_TEMP\" \"$FAR_LEAN_HOME/bin/lean\" \"$RUNNER_TEMP/FARCoreV11GeneratedAxiomAudit.lean\" \\\n  > \"$RUNNER_TEMP/far-core-v11-axioms.txt\" 2>&1 || { cat \"$RUNNER_TEMP/far-core-v11-axioms.txt\"; exit 1; }\npython tools/check_far_core_v11_formalization.py --axiom-output \"$RUNNER_TEMP/far-core-v11-axioms.txt\"\n"
    - name: Reject non-standard axioms in governed Lean declarations
      shell: bash
      run: "set -euo pipefail\n# tests/test_governed_lean_axioms.py skips without FAR_LEAN_HOME, and the validation engine does\n# not forward that variable to its checks. Run it here, where the pinned Lean is installed, and\n# treat a skip as a failure.\nlog=\"$RUNNER_TEMP/governed-lean-axioms.txt\"\npython tests/test_governed_lean_axioms.py -v > \"$log\" 2>&1 || { cat \"$log\"; exit 1; }\ncat \"$log\"\nif grep -q \"skipped\" \"$log\"; then\n  echo 'the governed Lean axiom census did not run' >&2\n  exit 1\nfi\n"
    - name: Assemble signed merge-authority certificate
      run: "python tools/assemble_validation_certificate.py \\\n  --evidence independent-oracle=artifacts/validation/runtime/independent-oracle.json \\\n  --evidence test-weakening=artifacts/validation/runtime/test-weakening.json \\\n  --evidence formal-model=artifacts/validation/runtime/formal-model.json \\\n  --evidence lean-proof=artifacts/validation/runtime/lean-proof.json \\\n  --evidence mutation-campaign=artifacts/validation/runtime/mutation-campaign.json\n"
    - name: Verify exact commit and tree certificate
      run: "python -m far_validation certificate verify --require-signed \\\n  --expected-commit \"$(git rev-parse HEAD)\" \\\n  --expected-tree \"$(git rev-parse HEAD^{tree})\" \\\n  --required-check bootstrap.manifest \\\n  --required-check selection.completeness \\\n  --required-check governance.research-gates \\\n  --required-check governance.claim-boundaries \\\n  --required-check governance.w5-authorization \\\n  --required-evidence independent-oracle \\\n  --required-evidence test-weakening \\\n  --required-evidence formal-model \\\n  --required-evidence lean-proof \\\n  --required-evidence mutation-campaign\n"
    - name: Stage complete assurance bundle
      if: always()
      shell: bash
      run: "mkdir -p artifacts/validation/runtime\nif [[ -d .far ]]; then\n  rm -rf artifacts/validation/runtime/far-state\n  cp -R .far artifacts/validation/runtime/far-state\nfi\n"
    - name: Upload assurance evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: exact-head-assurance-${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        path: artifacts/validation
        if-no-files-found: error
        retention-days: 30
  publish-dispatched-assurance:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: exact-head-assurance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
    - name: Publish dispatched assurance on reviewed head
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FAR_ASSURANCE_DISPATCH_HEAD: ${{ inputs.head_sha }}
        FAR_ASSURANCE_JOB_RESULT: ${{ needs.exact-head-assurance.result }}
      run: |
        set -euo pipefail
        case "$FAR_ASSURANCE_JOB_RESULT" in
          success) conclusion=success ;;
          cancelled) conclusion=cancelled ;;
          *) conclusion=failure ;;
        esac
        details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        jq -n \
          --arg name exact-head-assurance \
          --arg head_sha "$FAR_ASSURANCE_DISPATCH_HEAD" \
          --arg conclusion "$conclusion" \
          --arg details_url "$details_url" \
          --arg title "Trusted main exact-head assurance" \
          --arg summary "Trusted workflow run $GITHUB_RUN_ID validated the dispatched review head." \
          '{name:$name,head_sha:$head_sha,status:"completed",conclusion:$conclusion,details_url:$details_url,output:{title:$title,summary:$summary}}' \
          | gh api --method POST -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/check-runs" --input -
