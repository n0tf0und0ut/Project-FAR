name: PCA-W5 Approximation and Cost

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pca-w5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          # The release archive is bound to its SHA-256; no installer script or toolchain resolver runs.
          [[ "$(cat lean-toolchain)" == "leanprover/lean4:v4.19.0" ]] || { echo 'lean-toolchain changed; update the pinned archive and digest' >&2; exit 1; }
          archive="$RUNNER_TEMP/lean-4.19.0-linux.tar.zst"
          curl -sSfL --retry 3 --retry-delay 1 --retry-max-time 120 --connect-timeout 15 --max-time 120 -o "$archive" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Compile PCA-W5 formal control and reject sorry
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/w5-lean.txt"
          trap 'cat "$log"' EXIT
          lean mechanization/lean/W5ApproximationCost.lean > "$log" 2>&1
          # `lean` exits 0 when a declaration uses `sorry`; that is only a warning.
          if grep -q "declaration uses 'sorry'" "$log"; then
            echo 'PCA-W5 formal control contains sorry' >&2
            exit 1
          fi
      - name: Recompute PCA-W5 campaign
        run: python tools/check_pca_w5_approximation_cost.py
      - name: Run PCA-W5 conformance and adversarial tests
        run: python -m unittest tests.test_pca_w5_approximation_cost -v
