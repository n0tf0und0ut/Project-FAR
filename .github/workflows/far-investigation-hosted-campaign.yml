name: FAR Hosted Investigation Evidence Replay
on:
  push:
    branches: [research/general-investigation-engine-20261103]
permissions:
  contents: read
jobs:
  frozen-investigations:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen input and offline controls
        run: |
          python -m pip install 'PyYAML>=6.0,<7' 'jsonschema>=4.22,<5'
          echo 'c10854197fdff2f02785c66ab6ebe1795af1486525fe5885cd917ca939ac0f0a  research/investigation-engine/selection-v2.json' | sha256sum --check
          python -m unittest tests.test_far_investigation_retrieval tests.test_far_investigation_verifiers tests.test_far_investigation_engine tests.test_far_investigation_audit tests.test_far_investigation_campaign tests.test_far_investigation_odr_preparation tests.test_far_autonomous_investigation tests.test_far_uncertain_routing_pilot tests.test_far_routing_dispatch tests.test_far_intake_v1 -v
      - name: Replay original completed evidence without model execution
        run: python tools/far_investigation_campaign.py audit research/investigation-engine
      # Original negative hosted trial and exact workflow remain archived.
      # A separately registered successor is required for any new live trial.
