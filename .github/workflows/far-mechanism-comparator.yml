name: FAR mechanism comparator (Research only)

on:
  pull_request:
    paths:
      - 'research/mechanism-comparator/**'
      - '.github/workflows/far-mechanism-comparator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  far-mechanism-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact pinned minor-version libraries
        run: python -m pip install 'jsonschema==4.23.0' 'PyYAML==6.0.2'
      - name: Verify the preregistered W4/W6 reference set
        run: |
          set -euo pipefail
          python -m unittest tests.test_pca_w6_empirical_audit_utility -v
          python tools/check_pca_w6_empirical_audit_utility.py
      - name: Test active generic checker and actual strict FAR verifier
        run: |
          set -euo pipefail
          python research/mechanism-comparator/test_compare.py -v
      - name: Execute matched time and accuracy comparison
        run: |
          set -euo pipefail
          mkdir -p artifacts/far-mechanism-comparator
          python research/mechanism-comparator/compare.py \
            --output artifacts/far-mechanism-comparator/results.json \
            | tee artifacts/far-mechanism-comparator/console.log
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/far-mechanism-comparator/results.json").read_text())
          assert r["status"] == "RESEARCH_BOUNDED_INTERNAL_COMPARISON"
          assert r["sample"]["case_count"] == 18 and r["sample"]["agent_model_calls"] == 0
          assert r["lane_scores"]["schema"] == {
              "tp": 0, "fn": 12, "tn": 6, "fp": 0, "invalid": 0, "correct": 6, "total": 18}
          for lane in ("generic", "far"):
              assert r["lane_scores"][lane] == {
                  "tp": 12, "fn": 0, "tn": 6, "fp": 0, "invalid": 0, "correct": 18, "total": 18}
          assert len(r["secondary_integrity_challenges"]) == 3
          for case in r["secondary_integrity_challenges"]:
              assert case["predictions"]["far"]["class"] == "INVALID"
              assert case["predictions"]["generic"]["class"] == "NO_LOSS"
          for lane in ("schema", "generic", "far"):
              assert r["timing"]["per_lane"][lane]["samples"] == 378
          assert len(r["timing"]["observations"]) == 1134
          print("PASS_REGISTERED_MECHANISM_COMPARISON")
          PY
      - name: Check prototype source-content cache invalidation and diagnostic parity
        run: |
          set -euo pipefail
          python research/mechanism-comparator/test_profile_schema_cost.py -v
      - name: Post-hoc exploratory diagnosis of repeated schema compilation overhead
        run: |
          set -euo pipefail
          python research/mechanism-comparator/profile_schema_cost.py \
            --output artifacts/far-mechanism-comparator/schema-cache-probe.json \
            | tee artifacts/far-mechanism-comparator/schema-cache-console.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/far-mechanism-comparator/schema-cache-probe.json").read_text())
          assert r["status"] == "RESEARCH_POST_HOC_DIAGNOSTIC_NOT_PREREGISTERED_ENDPOINT"
          assert r["n_equivalence_cases"] == 24
          assert all(r["timing"][lane]["samples"] == 378 for lane in ("canonical","cached_prototype"))
          assert r["original_frozen_verifier_mutated"] is False
          print("PASS_SCHEMA_CACHE_DIAGNOSTIC_EQUIVALENCE")
          PY
      - name: Retain complete outcomes, timing and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: far-mechanism-comparator-results
          path: artifacts/far-mechanism-comparator
          retention-days: 30
          if-no-files-found: warn
