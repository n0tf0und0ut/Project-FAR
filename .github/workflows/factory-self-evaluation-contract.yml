name: Factory Self-Evaluation Contract

on:
  pull_request:
    paths:
      - "tools/factory_evaluation_contract.py"
      - "tests/test_factory_evaluation_contract.py"
      - "research/factory-evaluation/**"
      - "docs/maintenance/factory-self-evaluation.md"
      - ".github/workflows/factory-self-evaluation-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p test_factory_evaluation_contract.py -v
      - run: python tools/factory_evaluation_contract.py research/factory-evaluation/protocol-v1.json
