name: Codex FAR Specialist Adapter Contract

# A read-only, unprivileged validation surface; the protected Repository Health
# workflow is hash-locked and must not be changed by this adapter integration.
on:
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/far-*/**'
      - '.codex/agents/far_*.toml'
      - '.claude/skills/far-*/**'
      - 'tools/check_codex_far_specialists.py'
      - 'tests/test_codex_far_specialists.py'
      - 'docs/maintenance/codex-specialists.md'
      - '.github/workflows/codex-far-specialists.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify all fourteen source-linked adapters
        run: python tools/check_codex_far_specialists.py
      - name: Run focused adversarial regression tests
        run: python -m unittest tests.test_codex_far_specialists -v
