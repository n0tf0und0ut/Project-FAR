name: Living Research Promotion

on:
  schedule:
    - cron: '27,57 * * * *'
  workflow_run:
    workflows:
      - Living Research Watch
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: living-research-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout protected main automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          # The job token has write capabilities, so it must never be persisted where
          # candidate validation code can read Git's credential configuration.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Run fail-closed living-research promotion transaction
        # The adapter removes GH_TOKEN from its process environment before any candidate
        # materialization/validation subprocess executes. It injects the token only into
        # bounded GitHub API/git calls after validation, opens or recovers the exact PR,
        # and dispatches Validator Assurance on the exact promotion branch if and only if
        # merge-authority is absent for that head.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.run_living_research_promotion_ci
