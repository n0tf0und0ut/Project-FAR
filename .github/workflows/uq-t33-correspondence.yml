name: UQ-T33 Source-Bound Research Correspondence

on:
  pull_request:
    paths:
      - 'research/uq_t33_effective_quotients/**'
      - 'tests/test_uq_t33_*.py'
      - 'commercial/far-decision-integrity/src/far_decision_integrity/**'
      - '.github/workflows/uq-t33-correspondence.yml'

permissions:
  contents: read

jobs:
  real-source-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout actual PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.16'
      - name: Execute finite tests and real production adjudicator integration
        run: >-
          python -m unittest -v
          tests.test_uq_t33_effective_quotients
          tests.test_uq_t33_evidence_gate
          tests.test_uq_t33_source_bound_status
      - name: Emit source-bound scoped certificate (not I3 external independence)
        run: python -m research.uq_t33_effective_quotients.source_bound_status
