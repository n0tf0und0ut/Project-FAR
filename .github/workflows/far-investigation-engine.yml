name: FAR Investigation Engine
on:
  pull_request:
    paths:
      - 'tools/far_investigation_*.py'
      - 'tools/far_autonomous_investigation.py'
      - 'tools/far_uncertain_routing_pilot.py'
      - 'tools/far_routing_dispatch.py'
      - 'tests/test_far_investigation_*.py'
      - 'tests/test_far_autonomous_investigation.py'
      - 'tests/test_far_uncertain_routing_pilot.py'
      - 'tests/test_far_routing_dispatch.py'
      - 'mechanization/far_mechanization/**'
      - 'schemas/far-intake-v1.schema.json'
      - 'research/investigation-engine/**'
      - '.github/workflows/far-investigation-engine.yml'
permissions:
  contents: read
jobs:
  investigation-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'PyYAML>=6.0,<7' 'jsonschema>=4.22,<5'
      - name: Runtime, adversarial, native oracle and legacy regressions
        run: |
          python -m unittest tests.test_far_investigation_retrieval tests.test_far_investigation_verifiers tests.test_far_investigation_engine tests.test_far_investigation_audit tests.test_far_investigation_campaign tests.test_far_investigation_review_regression tests.test_far_investigation_usage tests.test_far_investigation_odr_preparation tests.test_far_autonomous_investigation tests.test_far_uncertain_routing_pilot tests.test_far_routing_dispatch tests.test_far_intake_v1 -v
          python -m mechanization.far_mechanization.contract_conformance --manifest conformance/far-ir-2.0-current/manifest.json
      - name: Offline transcript reproduction and frozen selection integrity
        run: python tools/far_investigation_campaign.py audit research/investigation-engine

  upstream-graph-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact FAR adapter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout actual pinned upstream graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: langchain-ai/open_deep_research
          ref: 1b7d2e80db9faa586165c60e09096dbbfd483a64
          path: upstream-odr-preparation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated preparation dependencies
        run: python -m pip install -r research/investigation-engine/requirements-odr-preparation-v0.1.txt
      - name: Exercise actual graph with scripted model and journaled read tools
        env:
          FAR_ODR_UPSTREAM_DIR: ${{ github.workspace }}/upstream-odr-preparation
        run: python -m unittest tests.test_far_investigation_odr_preparation -v
