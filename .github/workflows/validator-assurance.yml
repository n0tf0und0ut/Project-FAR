name: Validator Assurance

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assurance-hash-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          show-progress: false
          persist-credentials: false
      - name: Record assurance lock hash comparison
        shell: bash
        run: |
          python -I - <<'PY2'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          lock = json.loads((root / 'validation_bootstrap/assurance-lock.json').read_text(encoding='utf-8'))
          rows = []
          for raw, expected in sorted(lock['files'].items()):
              path = root / raw
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              rows.append({'path': raw, 'expected': expected, 'actual': actual, 'matches': actual == expected})
          payload = {'successful': all(row['matches'] for row in rows), 'files': rows}
          (root / 'artifacts/validation/assurance-hash-audit.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          raise SystemExit(0 if payload['successful'] else 1)
          PY2
      - name: Upload assurance hash audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assurance-hash-audit
          path: artifacts/validation/assurance-hash-audit.json
          if-no-files-found: error
          retention-days: 7

  signed-cache-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAR_VALIDATION_TRUST_DOMAIN: project-far:${{ github.repository }}:attested-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Produce signed cache bundle
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          export FAR_VALIDATION_CACHE_SIGNING_KEY="$key"
          python -m far_validation validate bootstrap.manifest --require-signed-cache
          printf '%s' "$key" > .far/cache-signing-key
          tar -czf artifacts/validation/signed-cache.tar.gz .far/cache .far/cache-signing-key
      - name: Record signed cache transport digest
        working-directory: artifacts/validation
        run: sha256sum signed-cache.tar.gz > signed-cache.tar.gz.sha256
      - name: Upload signed cache bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-validation-cache
          path: artifacts/validation
          if-no-files-found: error
          retention-days: 7

  signed-cache-consumer:
    needs: signed-cache-producer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAR_VALIDATION_TRUST_DOMAIN: project-far:${{ github.repository }}:attested-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-validation-cache
          path: artifacts/validation/cache-download
      - name: Verify cross-runner transport digest
        working-directory: artifacts/validation/cache-download
        run: sha256sum -c signed-cache.tar.gz.sha256
      - name: Consume signed cache on independent runner
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf artifacts/validation/cache-download/signed-cache.tar.gz
          export FAR_VALIDATION_CACHE_SIGNING_KEY="$(cat .far/cache-signing-key)"
          python -m far_validation validate bootstrap.manifest --require-signed-cache --format json > /tmp/cache-consumer.json
          python - <<'PY2'
          import json
          payload = json.load(open('/tmp/cache-consumer.json', encoding='utf-8'))
          hits = set(payload.get('signed_cache_hits', []))
          required = {'bootstrap.manifest'}
          missing = sorted(required - hits)
          if missing:
              raise SystemExit(f'signed cross-runner cache misses: {missing}')
          print('signed cross-runner cache trust: PASS')
          PY2

  merge-authority:
    needs: signed-cache-consumer
    # merge-authority is a required status check. Without this condition a failed dependency makes
    # it "skipped", and GitHub counts a skipped required check as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAR_VALIDATION_TRUST_DOMAIN: project-far:${{ github.repository }}
    steps:
      - name: Require the signed-cache chain to have succeeded
        shell: bash
        env:
          UPSTREAM_RESULT: ${{ needs.signed-cache-consumer.result }}
        run: |
          set -euo pipefail
          if [[ "$UPSTREAM_RESULT" != "success" ]]; then
            echo "signed-cache-consumer result is '$UPSTREAM_RESULT'; merge-authority requires success" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - name: Derive per-job ephemeral validation signing key
        shell: bash
        run: |
          set -euo pipefail
          # This job executes candidate code, so no persistent secret or token may be key material.
          # The key signs and verifies evidence inside this job only.
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "FAR_VALIDATION_CACHE_SIGNING_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            base="$(git merge-base HEAD origin/main)"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git rev-parse HEAD)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Prepare assurance artifact directory
        run: mkdir -p artifacts/validation/runtime
      - name: Verify independent bootstrap
        run: python -I validation_bootstrap/verify.py
      - name: Run independent legacy-checker oracle
        run: python -I -X "pycache_prefix=$RUNNER_TEMP/far-pycache" validation_bootstrap/run_isolated.py oracle --json > artifacts/validation/runtime/independent-oracle.json
      - name: Detect test and validator weakening
        run: >-
          python -I -X "pycache_prefix=$RUNNER_TEMP/far-pycache" validation_bootstrap/run_isolated.py weakening --base "${{ steps.base.outputs.sha }}" --json
          > artifacts/validation/runtime/test-weakening.json
      - name: Exhaustively model-check engine state space
        run: python -I -X "pycache_prefix=$RUNNER_TEMP/far-pycache" validation_bootstrap/run_isolated.py formal --max-checks 4 --json > artifacts/validation/runtime/formal-model.json
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          # The release archive is bound to its SHA-256; no installer script or toolchain resolver runs.
          [[ "$(cat lean-toolchain)" == "leanprover/lean4:v4.19.0" ]] || { echo 'lean-toolchain changed; update the pinned archive and digest' >&2; exit 1; }
          archive="$RUNNER_TEMP/lean-4.19.0-linux.tar.zst"
          curl -sSfL -o "$archive" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "FAR_LEAN_HOME=$RUNNER_TEMP/lean-4.19.0-linux" >> "$GITHUB_ENV"
      - name: Machine-check validation-engine assurance theorems
        shell: bash
        run: |
          set -euo pipefail
          "$FAR_LEAN_HOME/bin/lean" mechanization/lean/ValidationEngine.lean 2>&1 | tee artifacts/validation/runtime/lean-proof.log
          # `lean` exits 0 when a declaration uses `sorry`; that is only a warning.
          if grep -n "declaration uses 'sorry'" artifacts/validation/runtime/lean-proof.log; then
            echo 'validation-engine assurance theorems use sorry' >&2
            exit 1
          fi
          python -I - <<'PY2'
          import json
          from pathlib import Path
          Path('artifacts/validation/runtime/lean-proof.json').write_text(
              json.dumps({'successful': True, 'artifact': 'mechanization/lean/ValidationEngine.lean'}, indent=2),
              encoding='utf-8',
          )
          PY2
      # Every step above runs no candidate code, and its failure cannot be undone.
      # From here on, candidate code runs (pip install of the candidate's requirements, tests, checkers).
      # It can rewrite later steps through GITHUB_PATH, GITHUB_ENV or site-packages, so later results are ordinary CI.
      - name: Install dependencies and trace backend
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
      - name: Run validator assurance tests
        run: python -m unittest discover -s tests -p "test_validation_assurance.py" -v
      - name: Run complete traced validation profile
        run: >-
          python -m far_validation validate --profile pr-full --no-cache
          --trace-dependencies --require-trace --require-signed-cache
      - name: Run complete registered mutation campaign
        run: >-
          python -m far_validation mutations --json
          --report artifacts/validation/runtime/mutation-campaign.json
          > artifacts/validation/runtime/mutation-campaign.stdout.json
      # Compiling unlocked Lean can run code, so these steps are ordinary CI like the tests. They put the
      # compiles of lean.yml, far-core-v11-formalization.yml and pca-w5.yml into the required check.
      - name: Compile governed Lean modules and reject sorry
        shell: bash
        run: |
          set -euo pipefail
          lean() { "$FAR_LEAN_HOME/bin/lean" "$@"; }
          log="$RUNNER_TEMP/governed-lean.txt"
          trap 'cat "$log"' EXIT
          # A subshell, so a failing compile exits it and the trap still prints to the job log.
          (
            lean mechanization/lean/FARCore.lean
            lean mechanization/lean/SCoreW5.lean
            lean -o "$RUNNER_TEMP/UPPSemanticKernel.olean" mechanization/lean/UPPSemanticKernel.lean
            lean mechanization/lean/G2OpenWorldLowerBound.lean
            lean mechanization/lean/G3EpistemicMaximality.lean
            lean mechanization/lean/Canonicality.lean
            lean mechanization/lean/RepresentationInvariance.lean
            lean mechanization/lean/QuotientMinimality.lean
            lean mechanization/lean/DefinitionalCompleteness.lean
            lean mechanization/lean/ConservativeExtensibility.lean
            lean mechanization/lean/MaximalKnowability.lean
            lean mechanization/lean/CanonicalUniversalityTerminal.lean
            lean mechanization/lean/FARCanonicalBridge.lean
            lean mechanization/lean/FARCanonicalUniversalityDecision.lean
            LEAN_PATH="$RUNNER_TEMP" lean mechanization/lean/FARCanonicalCountermodel.lean
            lean mechanization/lean/W5ApproximationCost.lean
            lean -o "$RUNNER_TEMP/FARCoreV11Substrate.olean" mechanization/lean/FARCoreV11Substrate.lean
            LEAN_PATH="$RUNNER_TEMP" lean -o "$RUNNER_TEMP/FARCoreV11Claims001To012.olean" mechanization/lean/FARCoreV11Claims001To012.lean
            LEAN_PATH="$RUNNER_TEMP" lean -o "$RUNNER_TEMP/FARCoreV11Omega.olean" mechanization/lean/FARCoreV11Omega.lean
            LEAN_PATH="$RUNNER_TEMP" lean -o "$RUNNER_TEMP/FARCoreV11SSS.olean" mechanization/lean/FARCoreV11SSS.lean
            LEAN_PATH="$RUNNER_TEMP" lean mechanization/lean/FARCoreV11Mutations.lean
          ) > "$log" 2>&1
          # `lean` exits 0 when a declaration uses `sorry`; that is only a warning.
          if grep -n "declaration uses 'sorry'" "$log"; then
            echo 'a governed Lean module uses sorry' >&2
            exit 1
          fi
      - name: Enforce FAR-CORE v1.1 kernel assumptions
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_far_core_v11_formalization.py --emit-axiom-audit "$RUNNER_TEMP/FARCoreV11GeneratedAxiomAudit.lean"
          LEAN_PATH="$RUNNER_TEMP" "$FAR_LEAN_HOME/bin/lean" "$RUNNER_TEMP/FARCoreV11GeneratedAxiomAudit.lean" \
            > "$RUNNER_TEMP/far-core-v11-axioms.txt" 2>&1 || { cat "$RUNNER_TEMP/far-core-v11-axioms.txt"; exit 1; }
          python tools/check_far_core_v11_formalization.py --axiom-output "$RUNNER_TEMP/far-core-v11-axioms.txt"
      - name: Reject non-standard axioms in governed Lean declarations
        shell: bash
        run: |
          set -euo pipefail
          # tests/test_governed_lean_axioms.py skips without FAR_LEAN_HOME, and the validation engine does
          # not forward that variable to its checks. Run it here, where the pinned Lean is installed, and
          # treat a skip as a failure.
          log="$RUNNER_TEMP/governed-lean-axioms.txt"
          python tests/test_governed_lean_axioms.py -v > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          if grep -q "skipped" "$log"; then
            echo 'the governed Lean axiom census did not run' >&2
            exit 1
          fi
      - name: Assemble signed merge-authority certificate
        run: |
          python tools/assemble_validation_certificate.py \
            --evidence independent-oracle=artifacts/validation/runtime/independent-oracle.json \
            --evidence test-weakening=artifacts/validation/runtime/test-weakening.json \
            --evidence formal-model=artifacts/validation/runtime/formal-model.json \
            --evidence lean-proof=artifacts/validation/runtime/lean-proof.json \
            --evidence mutation-campaign=artifacts/validation/runtime/mutation-campaign.json
      - name: Verify exact commit and tree certificate
        run: |
          python -m far_validation certificate verify --require-signed \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})" \
            --required-check bootstrap.manifest \
            --required-check selection.completeness \
            --required-check governance.research-gates \
            --required-check governance.claim-boundaries \
            --required-check governance.w5-authorization \
            --required-evidence independent-oracle \
            --required-evidence test-weakening \
            --required-evidence formal-model \
            --required-evidence lean-proof \
            --required-evidence mutation-campaign
      - name: Stage complete assurance bundle
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/validation/runtime
          if [[ -d .far ]]; then
            rm -rf artifacts/validation/runtime/far-state
            cp -R .far artifacts/validation/runtime/far-state
          fi
      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validator-assurance-${{ github.sha }}
          path: artifacts/validation
          if-no-files-found: error
          retention-days: 30
