name: Advisory OpenCodeReview

# The existing protected review workflow is the read-only PR-event producer.
# OCR runs only on trusted-main workflow_run/manual events, never with a write
# token in a job reached directly by untrusted pull_request code.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/advisory-open-code-review.yml'
      - '.coderabbit.yaml'
      - 'docs/maintenance/external-ai-reviewers.md'
      - 'tests/test_external_ai_reviewers.py'
  workflow_run:
    workflows: ['Required PR Review Convergence']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open main-targeting PR to review at its current head'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: advisory-ocr-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify review integration and existing token boundary
        run: |
          python -m unittest \
            tests.test_external_ai_reviewers \
            tests.test_workflow_token_permissions -v
      - name: Evaluate deployed fallback jq selector against counterexamples
        run: python tools/advisory_jq_differential.py

  review:
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ocr-trusted-main
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve the current eligible PR from trusted GitHub metadata
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          REQUESTED_PR: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_name="$(jq -r '.workflow_run.name // ""' <<< "$EVENT_JSON")"
            run_event="$(jq -r '.workflow_run.event // ""' <<< "$EVENT_JSON")"
            run_repo="$(jq -r '.workflow_run.repository.full_name // ""' <<< "$EVENT_JSON")"
            if [[ "$run_name" != 'Required PR Review Convergence' ||
                  "$run_repo" != "$GITHUB_REPOSITORY" ||
                  ( "$run_event" != pull_request && "$run_event" != pull_request_review ) ]]; then
              echo 'Ignoring unrelated workflow run.'
              exit 0
            fi
            pr="$(jq -r '[.workflow_run.pull_requests[].number] | unique | if length == 1 then .[0] else empty end' <<< "$EVENT_JSON")"
            if [[ -z "$pr" ]]; then
              # Some GitHub workflow_run events omit the PR list; accept only
              # a unique, same-repository, main-targeting head-branch match.
              run_branch="$(jq -r '.workflow_run.head_branch // ""' <<< "$EVENT_JSON")"
              run_source_repo="$(jq -r '.workflow_run.head_repository.full_name // ""' <<< "$EVENT_JSON")"
              run_source_sha="$(jq -r '.workflow_run.head_sha // ""' <<< "$EVENT_JSON")"
              if [[ "$run_source_repo" != "$GITHUB_REPOSITORY" ||
                    ! "$run_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo 'No trustworthy source repository and head SHA for fallback PR matching.'
                exit 0
              fi
              if [[ -n "$run_branch" ]]; then
                candidates="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" --slurp \
                  | jq --arg branch "$run_branch" --arg repo "$GITHUB_REPOSITORY" --arg source_sha "$run_source_sha" \
                    '[.[][] | select(.head.ref == $branch and .head.repo.full_name == $repo and .head.sha == $source_sha) | .number] | unique')"
                pr="$(jq -r 'if length == 1 then .[0] else empty end' <<< "$candidates")"
              fi
            fi
            if [[ -z "$pr" ]]; then
              echo 'No unique PR in workflow run; a maintainer can dispatch by PR number.'
              exit 0
            fi
          else
            pr="$REQUESTED_PR"
          fi

          [[ "$pr" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number' >&2; exit 1; }
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
          state="$(jq -r '.state' <<< "$metadata")"
          target="$(jq -r '.base.ref' <<< "$metadata")"
          origin="$(jq -r '.head.repo.full_name // ""' <<< "$metadata")"
          draft="$(jq -r '.draft' <<< "$metadata")"
          head="$(jq -r '.head.sha' <<< "$metadata")"
          if [[ "$state" != open || "$target" != main || "$origin" != "$GITHUB_REPOSITORY" || "$draft" != false ]]; then
            echo 'Skipping closed, draft, fork, or non-main PR; no LLM credentials exposed.'
            exit 0
          fi
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid PR head SHA' >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            source_sha="$(jq -r '.workflow_run.pull_requests[0].head.sha // ""' <<< "$EVENT_JSON")"
            if [[ -z "$source_sha" ]]; then
              source_sha="$(jq -r '.workflow_run.head_sha // ""' <<< "$EVENT_JSON")"
            fi
            if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ || "$source_sha" != "$head" ]]; then
              echo 'Workflow run does not bind the current PR head; skipping stale or ambiguous review.'
              exit 0
            fi
          fi
          {
            echo "enabled=true"
            echo "pr_number=$pr"
            echo "head_sha=$head"
            echo "base_ref=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Verify optional LLM provider configuration
        if: steps.context.outputs.enabled == 'true'
        id: provider
        shell: bash
        env:
          OCR_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_URL: ${{ vars.OCR_LLM_URL }}
          OCR_MODEL: ${{ vars.OCR_LLM_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "$OCR_TOKEN" || -z "$OCR_URL" || -z "$OCR_MODEL" ]]; then
            echo 'OpenCodeReview not configured: set OCR_LLM_AUTH_TOKEN secret and OCR_LLM_URL/OCR_LLM_MODEL variables.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Alibaba OpenCodeReview at pinned action and CLI version
        if: steps.context.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true'
        uses: alibaba/open-code-review@b1dcffb0729f3f2e3e47170968a5014a2e035580 # v1.13.7
        with:
          ocr_version: '1.13.7'
          pr_number: ${{ steps.context.outputs.pr_number }}
          base_ref: ${{ steps.context.outputs.base_ref }}
          head_sha: ${{ steps.context.outputs.head_sha }}
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
          effort: 'medium'
          max_tokens_budget: ${{ vars.OCR_MAX_TOKENS_BUDGET || '50000' }}
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
          resolve_outdated: 'false'
          upload_artifacts: 'true'
