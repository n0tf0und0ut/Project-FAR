name: Weight Space Offline Checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/weight-space-offline-checks.yml'
      - 'tools/weight_space_*.py'
      - 'tools/check_weight_space_publication.py'
      - 'tests/test_weight_space_*.py'
      - 'research/weight-space/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-and-evidence-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==1.26.4'
      - name: Test declarative edits and adversarial evidence controls
        run: python -m unittest tests.test_weight_space_edits tests.test_weight_space_pilot tests.test_weight_space_publication -v
      - name: Validate frozen schedule without model downloads or inference
        run: python -m tools.weight_space_pilot validate
      - name: Reconstruct retained evidence and negative result without inference
        run: python -m tools.check_weight_space_publication
