name: Software Factory Intake (Advisory)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open GitHub issue to compile into a reviewable factory draft
        required: true
        type: number
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  compile-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'factory-intake')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile open issue into an advisory draft
        id: compile
        env:
          GH_READ_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          BASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          GITHUB_TOKEN="$GH_READ_TOKEN" python tools/software_factory_intake.py draft-issue \
            --repo "$TARGET_REPOSITORY" --issue "$ISSUE_NUMBER" \
            --base-sha "$BASE_SHA" --output factory-intake-draft.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            state=ready_for_manual_submission
          elif [ "$rc" -eq 3 ]; then
            state=needs_clarification
          else
            exit "$rc"
          fi
          echo "status=$state" >> "$GITHUB_OUTPUT"
          echo "Factory intake status: $state (advisory only)" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reviewable intake draft
        uses: actions/upload-artifact@v4
        with:
          name: software-factory-intake-${{ github.run_id }}
          path: factory-intake-draft.json
          if-no-files-found: error
          retention-days: 7
