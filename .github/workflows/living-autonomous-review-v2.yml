name: Living Autonomous Review v2

on:
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run autonomous review or validate the current ref
        required: true
        default: review
        type: choice
        options: [review, validate]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/living-autonomous-review-v2.yml'
      - '.github/workflows/exact-head-assurance.yml'
      - 'tools/run_living_autonomous_review.py'
      - 'tools/living_autonomous_review_*.py'
      - 'tests/test_living_autonomous_review.py'
      - 'tests/test_living_autonomous_review_*.py'
      - 'research/living/autonomous-review-policy-v1.0.json'
      - 'research/living/promotion-policy-v1.0.json'
      - 'research/living/implementation-policy-v1.0.json'
      - 'research/living/project-change-policy-v1.0.json'
      - 'research/living/lifecycle-v1.0.json'

permissions:
  contents: read

concurrency:
  group: living-autonomous-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.mode == 'validate' && format('validate-{0}', github.ref) || 'review' }}
  cancel-in-progress: false

env:
  SOURCE_BRANCH: automation/living-research-inbox
  REVIEW_PREFIX: automation/living-autonomous-review-

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: Install canonical dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate autonomous review contract
        run: |
          python -m tools.run_living_autonomous_review --help >/dev/null
          python -m unittest \
            tests.test_living_autonomous_review \
            tests.test_living_autonomous_review_source_binding \
            tests.test_living_autonomous_review_exact_head_dispatch -v
          python -m unittest \
            tests.test_living_research_promotion \
            tests.test_living_project_change_obligations \
            tests.test_living_implementation_contract -v
          python tools/check_research_gates.py
          python tools/repo_health_check.py --fast

  review:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: living-research-writer
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: Install canonical dependencies
        run: python -m pip install -r requirements.txt
      - name: Require model credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"

      - name: Freeze protected main and permanent inbox
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          base_sha="$(git rev-parse 'origin/main^{commit}')"
          source_sha="$(git rev-parse "origin/$SOURCE_BRANCH^{commit}")"
          pr_json="$(gh pr view 490 --repo "$GITHUB_REPOSITORY" --json state,isDraft,baseRefName,headRefName,headRefOid,headRepositoryOwner)"
          PR_JSON="$pr_json" SOURCE_SHA="$source_sha" REPO_OWNER="${GITHUB_REPOSITORY%%/*}" python - <<'PY'
          import json, os
          value=json.loads(os.environ['PR_JSON'])
          expected={'state':'OPEN','isDraft':True,'baseRefName':'main','headRefName':'automation/living-research-inbox'}
          for key,wanted in expected.items():
              if value.get(key)!=wanted:
                  raise SystemExit(f'PR #490 identity drift: {key}={value.get(key)!r}')
          owner=(value.get('headRepositoryOwner') or {}).get('login')
          if owner != os.environ['REPO_OWNER']:
              raise SystemExit(f'PR #490 owner drift: {owner!r}')
          if value.get('headRefOid') != os.environ['SOURCE_SHA']:
              raise SystemExit('PR #490 head differs from fetched source branch')
          PY
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Enforce one repository-owned autonomous review at a time
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 \
            --json headRefName,headRepositoryOwner \
            --jq "[.[] | select(.headRepositoryOwner.login == \"$owner\" and (.headRefName | startswith(\"$REVIEW_PREFIX\")))] | length")"
          if [[ "$count" != 0 ]]; then
            echo "continue=false" >> "$GITHUB_OUTPUT"
            echo "A repository-owned autonomous review PR is already open."
          else
            echo "continue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract exact inbox snapshot
        if: steps.gate.outputs.continue == 'true'
        run: |
          rm -rf "$RUNNER_TEMP/living-source" "$RUNNER_TEMP/living-package"
          mkdir -p "$RUNNER_TEMP/living-source" "$RUNNER_TEMP/living-package"
          git archive "${{ steps.freeze.outputs.source_sha }}" | tar -x -C "$RUNNER_TEMP/living-source"

      - name: Execute bounded autonomous adjudication
        if: steps.gate.outputs.continue == 'true'
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python -m tools.run_living_autonomous_review \
            --source-root "$RUNNER_TEMP/living-source" \
            --out-root "$RUNNER_TEMP/living-package"
          status="$(jq -r '.status' "$RUNNER_TEMP/living-package/manifest.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == review_ready ]]; then
            echo "candidate_id=$(jq -r '.candidate_id' "$RUNNER_TEMP/living-package/manifest.json")" >> "$GITHUB_OUTPUT"
            echo "candidate_sha256=$(jq -r '.candidate_sha256' "$RUNNER_TEMP/living-package/manifest.json")" >> "$GITHUB_OUTPUT"
            echo "disposition=$(jq -r '.disposition' "$RUNNER_TEMP/living-package/manifest.json")" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist bounded retry record only
        if: steps.gate.outputs.continue == 'true' && (steps.review.outputs.status == 'source_blocked' || steps.review.outputs.status == 'review_retry_blocked')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          old_source="${{ steps.freeze.outputs.source_sha }}"
          base_sha="${{ steps.freeze.outputs.base_sha }}"
          git switch -C "$SOURCE_BRANCH" "$base_sha"
          for path in research/living/inbox research/living/runs research/living/state-v1.0.json research/living/repository-state-v1.0.json; do
            if [[ -e "$RUNNER_TEMP/living-source/$path" ]]; then
              mkdir -p "$(dirname "$path")"; rm -rf "$path"; cp -a "$RUNNER_TEMP/living-source/$path" "$path"
            fi
          done
          cp -a "$RUNNER_TEMP/living-package/inbox/." .
          python tools/reconcile_living_repo.py
          python tools/check_living_research.py
          python -m unittest tests.test_living_research tests.test_living_research_workflow tests.test_living_autonomous_review -v
          python tools/check_research_gates.py
          python tools/repo_health_check.py --fast
          git config user.name project-far-research-bot
          git config user.email project-far-research-bot@users.noreply.github.com
          git add research/living docs/research/living-research-status.md docs/research/living-repository-status.md
          git diff --cached --quiet && exit 0
          git commit -m 'research: back off blocked autonomous review'
          test "$(git rev-parse HEAD^)" = "$base_sha"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          [[ "$(git rev-parse 'origin/main^{commit}')" == "$base_sha" ]] || { echo 'main advanced during autonomous review' >&2; exit 1; }
          [[ "$(git rev-parse "origin/$SOURCE_BRANCH^{commit}")" == "$old_source" ]] || { echo 'living inbox advanced during autonomous review' >&2; exit 1; }
          git push --force-with-lease="$SOURCE_BRANCH:$old_source" origin "HEAD:$SOURCE_BRANCH"
          pushed_head="$(git rev-parse HEAD^{commit})"
          remote_head="$(git ls-remote --heads origin "$SOURCE_BRANCH" | awk '{print $1}')"
          [[ "$remote_head" == "$pushed_head" ]] || { echo 'retry-only inbox push head mismatch' >&2; exit 1; }
          gh workflow run living-research.yml --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_BRANCH" -f mode=validate

      - name: Materialize and validate human-review branch
        if: steps.gate.outputs.continue == 'true' && steps.review.outputs.status == 'review_ready'
        id: review_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cid="${{ steps.review.outputs.candidate_id }}"
          expected="${{ steps.review.outputs.candidate_sha256 }}"
          base_sha="${{ steps.freeze.outputs.base_sha }}"
          frozen_source="${{ steps.freeze.outputs.source_sha }}"
          tag="${expected:0:12}"
          branch="$REVIEW_PREFIX$cid-$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          [[ "$(git rev-parse 'origin/main^{commit}')" == "$base_sha" ]] || { echo 'main advanced during autonomous review' >&2; exit 1; }
          [[ "$(git rev-parse "origin/$SOURCE_BRANCH^{commit}")" == "$frozen_source" ]] || { echo 'living inbox advanced during autonomous review' >&2; exit 1; }
          actual="$(git show "origin/$SOURCE_BRANCH:research/living/inbox/candidates/$cid.json" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo 'candidate bytes moved during autonomous review' >&2; exit 1; }

          git switch -C "$branch" "$base_sha"
          cp -a "$RUNNER_TEMP/living-package/review/." .
          python tools/reconcile_living_repo.py
          git config user.name project-far-research-bot
          git config user.email project-far-research-bot@users.noreply.github.com
          git add research/living docs/audits docs/research/living-research-status.md docs/research/living-repository-status.md
          git diff --cached --check
          git commit -m "Research: autonomous living review $cid"
          test "$(git rev-parse HEAD^)" = "$base_sha"

          python -m unittest tests.test_living_autonomous_review -v
          python -m unittest tests.test_living_research_promotion tests.test_living_project_change_obligations tests.test_living_implementation_contract -v
          if [[ "${{ steps.review.outputs.disposition }}" == PROJECT_CHANGE_REQUIRED ]]; then
            python tools/check_living_project_change_obligations.py --source-ref HEAD
            python -m tools.living_implementation_contract \
              --source-root . --source-sha "$(git rev-parse HEAD)" --base-sha "$base_sha" \
              --output "$RUNNER_TEMP/living-implementation-plan.json"
          fi
          python tools/check_living_research.py
          python tools/check_research_gates.py
          python tools/repo_health_check.py --fast
          test -z "$(git status --porcelain --untracked-files=all)"

          # Long validation may race moving refs. Recheck immediately before publication.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          [[ "$(git rev-parse 'origin/main^{commit}')" == "$base_sha" ]] || { echo 'main advanced during autonomous review' >&2; exit 1; }
          [[ "$(git rev-parse "origin/$SOURCE_BRANCH^{commit}")" == "$frozen_source" ]] || { echo 'living inbox advanced during autonomous review' >&2; exit 1; }
          actual="$(git show "origin/$SOURCE_BRANCH:research/living/inbox/candidates/$cid.json" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo 'candidate bytes moved during autonomous review' >&2; exit 1; }
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1 && { echo "branch collision: $branch" >&2; exit 1; }
          git push origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open human-merge review PR and explicitly dispatch validation
        if: steps.gate.outputs.continue == 'true' && steps.review.outputs.status == 'review_ready'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cid="${{ steps.review.outputs.candidate_id }}"
          disposition="${{ steps.review.outputs.disposition }}"
          branch="${{ steps.review_branch.outputs.branch }}"
          head_sha="${{ steps.review_branch.outputs.head_sha }}"
          base_sha="${{ steps.freeze.outputs.base_sha }}"
          cat > "$RUNNER_TEMP/review-pr.md" <<EOF
          ## Autonomous governed review

          - candidate: \`$cid\`
          - proposed disposition: \`$disposition\`
          - exact reviewed candidate SHA-256: \`${{ steps.review.outputs.candidate_sha256 }}\`
          - frozen source head: \`${{ steps.freeze.outputs.source_sha }}\`
          - frozen protected-main base: \`$base_sha\`
          - exact review head: \`$head_sha\`

          These bytes have no protected scientific authority before human merge. Project-changing proposal/payload bytes, if present, exist only on this human-review branch before merge; they were never written to the unprotected rolling PR #490. Automation never merges this PR or downstream promotion/implementation PRs.
          EOF
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Research: autonomous living review $cid — $disposition" --body-file "$RUNNER_TEMP/review-pr.md")"
          [[ "$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" == "$head_sha" ]] || { echo 'created PR head drifted' >&2; exit 1; }

          # GITHUB_TOKEN-created PRs do not reliably emit the normal PR workflow cascade.
          gh workflow run living-autonomous-review-v2.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f mode=validate
          gh workflow run living-research.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f mode=validate
          gh workflow run validator-assurance.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run exact-head-assurance.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f head_sha="$head_sha" -f base_sha="$base_sha"
