name: Pinned Lean Transport Fault Fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validator-assurance.yml'
      - '.github/workflows/exact-head-assurance.yml'
      - '.github/workflows/lean.yml'
      - '.github/workflows/far-core-v11-formalization.yml'
      - '.github/workflows/pca-w5.yml'
      - '.github/workflows/pinned-lean-transport.yml'
      - 'tests/test_pinned_lean_transport.py'
      - 'tests/pinned_lean_transport_http.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-fault-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.16'
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Check bounded transport contracts and immutable pins
        run: python -m unittest tests.test_pinned_lean_transport -v
      - name: Exercise real curl over local IPC with HTTP fault injection
        run: python -m tests.pinned_lean_transport_http -v
