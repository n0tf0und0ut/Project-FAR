name: AgentAlphaXiv 002 Release-Mismatch Triage (Research)

# Posthoc diagnosis of a recorded discrepancy; never a prospective scientific comparison.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/agent-alphaxiv-mismatch-triage.yml'
      - 'tools/agent_alphaxiv_mismatch_triage.py'
      - 'tests/test_agent_alphaxiv_mismatch_triage.py'

permissions:
  contents: read

concurrency:
  group: agent-alphaxiv-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  forensic-categories:
    if: >-
      github.repository == 'n0tf0und0ut/Project-FAR' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.head_ref == 'research/agent-alphaxiv-001-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_ETAG_TIMEOUT: '20'
    steps:
      - name: Checkout exact research head without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Test forensic labels, source equality, archive safety
        run: |
          python -m unittest discover -s tests -p 'test_agent_alphaxiv_mismatch_triage.py' -v
          python -m unittest discover -s tests -p 'test_agent_alphaxiv_archive_receipt.py' -v
          python -m py_compile tools/agent_alphaxiv_mismatch_triage.py

      - name: Install pinned read-only datasets client
        run: python -m pip install --disable-pip-version-check 'datasets==4.4.1'

      - name: Reverify same original bytes and classify mismatch kinds
        run: |
          python tools/agent_alphaxiv_mismatch_triage.py \
            --prior-receipt research/external-validation/agent-alphaxiv-002/archive-byte-receipt-v0.1.json \
            --output "$RUNNER_TEMP/agent-alphaxiv-002-mismatch-triage.json"
          sha256sum "$RUNNER_TEMP/agent-alphaxiv-002-mismatch-triage.json"

      - name: Retain posthoc exact-byte triage receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-alphaxiv-mismatch-triage-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/agent-alphaxiv-002-mismatch-triage.json
          if-no-files-found: warn
          retention-days: 14
