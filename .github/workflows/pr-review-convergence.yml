name: PR Review Convergence

# Runs trusted protected-main code only. Required PR checks must originate
# from eligible PR events; schedule/manual publications are advisory only.
on:
  push:
    branches: [repair/legacy-review-publications-20261023]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Single PR number, or 0 for all open main PRs
        type: number
        required: true
        default: 0

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      numbers: ${{ steps.freeze.outputs.numbers }}
    steps:
      - name: Determine PR identities without running PR code
        id: freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # GitHub's typed number input is rendered as "587.0" (or "0.0") in
          # the Actions environment. Require an integer value; normalize its
          # decimal-only representation before JSON matrix construction.
          normalized_pr_number=""
          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$INPUT_PR_NUMBER" =~ ^(0|[1-9][0-9]*)(\.0+)?$ ]] || {
              echo "Invalid integer-valued pr_number: $INPUT_PR_NUMBER" >&2
              exit 1
            }
            normalized_pr_number="${INPUT_PR_NUMBER%%.*}"
          fi
          if [[ "$GH_EVENT_NAME" == "schedule" || ( "$GH_EVENT_NAME" == "workflow_dispatch" && "$normalized_pr_number" == "0" ) ]]; then
            numbers="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" --jq '.[].number' | jq -sc 'map(tonumber)')"
          elif [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            numbers="[$normalized_pr_number]"
          elif [[ "$GH_EVENT_NAME" == "issue_comment" && "$EVENT_COMMENT_AUTHOR" != "chatgpt-codex-connector[bot]" ]]; then
            numbers='[]'
          elif [[ "$GH_EVENT_NAME" == "issue_comment" ]]; then
            numbers="[$EVENT_ISSUE_NUMBER]"
          elif [[ "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            numbers="[$EVENT_PR_NUMBER]"
          else
            echo "Unrecognized PR event identity" >&2
            exit 1
          fi
          jq -e 'type == "array" and all(.[]; type == "number" and . > 0)' <<< "$numbers" >/dev/null
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  review-convergence:
    needs: discover
    # PR-driven jobs never receive a write token. Result publication stays on
    # main; the separate manual repair below can rename proven legacy records.
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.numbers) }}
    concurrency:
      group: pr-review-convergence-publish-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
    steps:
      - name: Checkout protected main (not the candidate)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Verify current identity and publish review evidence on exact head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          api="/repos/$GITHUB_REPOSITORY"
          metadata="$(gh api "$api/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.base.ref' <<< "$metadata")" == main ]] || { echo 'PR does not target main' >&2; exit 1; }
          [[ "$(jq -r '.state' <<< "$metadata")" == open ]] || exit 0
          sha="$(jq -r '.head.sha' <<< "$metadata")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          output="$RUNNER_TEMP/pr-review-convergence.json"
          set +e
          python3 tools/pr_review_convergence.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --expected-head "$sha" \
            --output "$output" \
            --mode enforce
          rc=$?
          set -e
          # Do not post a stale result to a moving head.
          current="$(gh api "$api/pulls/$PR_NUMBER" --jq .head.sha)"
          [[ "$current" == "$sha" ]] || { echo 'PR moved during review evaluation' >&2; exit 1; }
          if [[ "$rc" == 0 ]]; then
            conclusion=success
            if [[ -f "$output" ]] && jq -e '.draft == true' "$output" >/dev/null; then
              conclusion=neutral
            fi
          else
            conclusion=failure
          fi
          summary="Read-only review metadata check for PR #$PR_NUMBER at $sha. See workflow evidence; not a proof of software correctness."
          jq -n \
            --arg sha "$sha" \
            --arg conclusion "$conclusion" \
            --arg summary "$summary" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{name:"pr-review-convergence-scheduled-observation",head_sha:$sha,status:"completed",conclusion:$conclusion,details_url:$url,output:{title:"PR review convergence (advisory)",summary:$summary}}' \
          | gh api --method POST "$api/check-runs" --input -
          if [[ "$rc" != 0 ]]; then
            echo "Review evidence incomplete or unconverged (exit $rc)" >&2
            exit "$rc"
          fi
      - name: Preserve exact-head review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-review-convergence-${{ matrix.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-review-convergence.json
          if-no-files-found: warn
          retention-days: 30

  legacy-review-activation:
    # Initial push intentionally stops read-only. Explicit retry activates a
    # reviewed immutable source; the dependent writer is skipped until then.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/repair/legacy-review-publications-20261023') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/repair/legacy-review-publications-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    steps:
      - name: Require explicit activation and construct a provenance-checked plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == n0tf0und0ut/Project-FAR ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            echo 'Explicit job retry after exact-source review and tests is required.' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$PR_NUMBER" =~ ^578([.]0+)?$ ]]
          fi
          api="/repos/$GITHUB_REPOSITORY/contents/tools"
          gh api "$api/retire_legacy_review_publications.py?ref=7da4d20b242fe6d327e342d61ac06094b2a5ac6b" --jq .content | base64 --decode > "$RUNNER_TEMP/retire_legacy_review_publications.py"
          gh api "$api/pr_review_convergence_operator.py?ref=57bfc75b2af375efb1774faf0c418147097c0d10" --jq .content | base64 --decode > "$RUNNER_TEMP/pr_review_convergence.py"
          printf '%s  %s\n' 7fc2d125cf05c7f2dba80b013e25f44c45aaaceb7b019b2793a6ccce97fe64f3 "$RUNNER_TEMP/retire_legacy_review_publications.py" | sha256sum --check --status
          printf '%s  %s\n' ff3bab0fcdc4d0eeb7e94af21eb1df2c2cde6858ca8cbfa14363b08b804644a0 "$RUNNER_TEMP/pr_review_convergence.py" | sha256sum --check --status
          python3 "$RUNNER_TEMP/retire_legacy_review_publications.py" \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/legacy-review-name-repair.json"
      - name: Preserve the operation and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-review-name-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/legacy-review-name-repair.json
            ${{ runner.temp }}/review-*.json
          if-no-files-found: warn
          retention-days: 30

  legacy-review-retirement:
    needs: legacy-review-activation
    # No PR-origin write token, no checkout, no conclusion/status mutation.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/repair/legacy-review-publications-20261023' && github.run_attempt > 1) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/repair/legacy-review-publications-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: legacy-review-name-retirement-${{ github.repository }}-578
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: write
    steps:
      - name: Recheck readiness and rename only proven legacy scheduled records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == n0tf0und0ut/Project-FAR ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          api="/repos/$GITHUB_REPOSITORY/contents/tools"
          gh api "$api/retire_legacy_review_publications.py?ref=7da4d20b242fe6d327e342d61ac06094b2a5ac6b" --jq .content | base64 --decode > "$RUNNER_TEMP/retire_legacy_review_publications.py"
          gh api "$api/pr_review_convergence_operator.py?ref=57bfc75b2af375efb1774faf0c418147097c0d10" --jq .content | base64 --decode > "$RUNNER_TEMP/pr_review_convergence.py"
          printf '%s  %s\n' 7fc2d125cf05c7f2dba80b013e25f44c45aaaceb7b019b2793a6ccce97fe64f3 "$RUNNER_TEMP/retire_legacy_review_publications.py" | sha256sum --check --status
          printf '%s  %s\n' ff3bab0fcdc4d0eeb7e94af21eb1df2c2cde6858ca8cbfa14363b08b804644a0 "$RUNNER_TEMP/pr_review_convergence.py" | sha256sum --check --status
          python3 "$RUNNER_TEMP/retire_legacy_review_publications.py" \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/legacy-review-name-repair.json" \
            --apply
      - name: Preserve the operation and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-review-name-applied-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/legacy-review-name-repair.json
            ${{ runner.temp }}/review-*.json
          if-no-files-found: warn
          retention-days: 30

  # Candidate-driven events use only read permissions. They cannot publish
  # checks or acquire privileged tokens even if a candidate changes a workflow.
  review-evidence:
    needs: discover
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'issue_comment'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.numbers) }}
    concurrency:
      group: pr-review-convergence-observe-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted main, never candidate code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Collect observational review evidence without write token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.base.ref' <<< "$pr")" == main ]] || exit 0
          sha="$(jq -r '.head.sha' <<< "$pr")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          python3 tools/pr_review_convergence.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --expected-head "$sha" \
            --output "$RUNNER_TEMP/pr-review-convergence.json" \
            --mode report
      - name: Preserve read-only observational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-review-observation-${{ matrix.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-review-convergence.json
          if-no-files-found: warn
          retention-days: 30
