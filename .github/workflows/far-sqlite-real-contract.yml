name: FAR SQLite bounded external real-engine certificate

on:
  pull_request:
    paths:
      - 'research/sqlite-real-contract/**'
      - '.github/workflows/far-sqlite-real-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-finite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute independently specified SQLite semantics and verify exact quotient
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sqlite-real
          python research/sqlite-real-contract/replay.py 2>&1 | tee artifacts/sqlite-real/engine-verification.json
      - name: Install pinned Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.19.0'
          archive="$RUNNER_TEMP/lean-4.19.0-linux.tar.zst"
          curl -sSfL --retry 3 --retry-delay 1 --retry-max-time 120 --connect-timeout 15 --max-time 120 -o "$archive" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the actual-engine-bound finite theorem and countermodels
        shell: bash
        run: |
          set -euo pipefail
          lean research/sqlite-real-contract/FiniteSQLite.lean 2>&1 | tee artifacts/sqlite-real/lean-kernel.txt
          if grep -Ei 'error:|declaration uses .sorry.|sorryAx' artifacts/sqlite-real/lean-kernel.txt; then
            echo 'Lean kernel proof not established' >&2
            exit 1
          fi
      - name: Retain runtime oracle and exact kernel dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: far-sqlite-real-contract
          path: artifacts/sqlite-real
          if-no-files-found: warn
          retention-days: 30
