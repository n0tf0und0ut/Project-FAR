name: AgentAlphaXiv Candidate Metadata Intake (Research)

# This job retrieves metadata only. It cannot approve, launch, score, or
# adjudicate FAR-AGENT-ALPHAXIV-001. Never silently repin the source.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/agent-alphaxiv-candidate-intake.yml'
      - 'tools/agent_alphaxiv_external_intake.py'
      - 'tests/test_agent_alphaxiv_external_intake.py'
      - 'research/external-validation/agent-alphaxiv-001/**'

permissions:
  contents: read

concurrency:
  group: agent-alphaxiv-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  metadata-only-intake:
    if: >-
      github.repository == 'n0tf0und0ut/Project-FAR' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.head_ref == 'research/agent-alphaxiv-001-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_ETAG_TIMEOUT: '20'
    steps:
      - name: Checkout exact untrusted research candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify candidate sampling and failure contract
        run: |
          python -m unittest discover -s tests -p 'test_agent_alphaxiv_external_intake.py' -v
          python -m py_compile tools/agent_alphaxiv_external_intake.py

      - name: Install pinned read-only metadata client
        run: python -m pip install --disable-pip-version-check 'datasets==4.4.1'

      - name: Retrieve pinned study metadata and generate candidate receipt
        run: |
          python tools/agent_alphaxiv_external_intake.py --from-hub --output "$RUNNER_TEMP/agent-alphaxiv-candidate.json"
          sha256sum "$RUNNER_TEMP/agent-alphaxiv-candidate.json"
          python - "$RUNNER_TEMP/agent-alphaxiv-candidate.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['status'] == 'RESEARCH_CANDIDATE_NOT_LAUNCHED'
          assert p['dataset_revision'] == 'a63f46066ac16fcb470f41933415e175825b6bcc'
          assert p['all_studies'] == 961 and p['paper_cohort'] == 926
          assert len(p['selected']) == 60 and p['verified_empirical_claims'] == 0
          print('CANDIDATE_INTAKE_COUNTS_VERIFIED', p['manifest_sha256'])
          PY

      - name: Preserve non-confirmatory intake manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-alphaxiv-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/agent-alphaxiv-candidate.json
          if-no-files-found: error
          retention-days: 14
